  <path d="M200 170 l40 90 M300 165 l-25 70" stroke="#7a4e24" stroke-width="8" stroke-linecap="round"/>
  <!-- 배 -->
  <path d="M110 330 h292 l-40 62 h-212z" fill="#7a4e24" stroke="#1b120a" stroke-width="10" stroke-linejoin="round"/>
  <circle cx="200" cy="358" r="9" fill="#1b120a"/>
  <circle cx="256" cy="358" r="9" fill="#1b120a"/>
  <circle cx="312" cy="358" r="9" fill="#1b120a"/>
  <!-- 물결 -->
  <path d="M60 410 q32 -18 64 0 t64 0 t64 0 t64 0 t64 0 t64 0" fill="none" stroke="#8fc3d6" stroke-width="10" stroke-linecap="round"/>
